name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Xcode 27: older SwiftPM can't find resource bundles inside an app (see scripts/build-app.sh).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          # The build number is the commit count.
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - run: swift --version
      - run: swift build
      # One task thread, as the app may get: any blocking call in async code then hangs a test instead of passing.
      - run: swift test
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: 1
      # Releases are signed with Developer ID and notarized once these secrets exist; until then, signed ad hoc.
      - name: Load the Developer ID certificate and the notary key
        if: github.ref_type == 'tag'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          [ -n "$DEVELOPER_ID_P12" ] || { echo "No Developer ID secrets: this release is signed ad hoc"; exit 0; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "LAIR_SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
          echo "LAIR_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Make the disk image
        env:
          LAIR_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          LAIR_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export LAIR_VERSION="${GITHUB_REF_NAME#v}"; fi
          LAIR_SIGN_IDENTITY="${LAIR_SIGN_IDENTITY:--}" scripts/make-dmg.sh "$RUNNER_TEMP/Lair.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Lair
          path: ${{ runner.temp }}/Lair.dmg
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/Lair.dmg" "$RUNNER_TEMP/Lair-$GITHUB_REF_NAME.dmg"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/Lair-$GITHUB_REF_NAME.dmg" \
            --title "Lair $GITHUB_REF_NAME" --generate-notes --prerelease
