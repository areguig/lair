name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Xcode 27: older SwiftPM can't find resource bundles inside an app (see scripts/build-app.sh).
    runs-on: xcode-27
    env:
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The build number is the commit count.
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - run: swift --version
      - run: swift build
      # One task thread, as the app may get: any blocking call in async code then hangs a test instead of passing.
      - run: swift test
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: 1
      # Releases are signed with Developer ID and notarized once these secrets exist; until then, signed ad hoc.
      - uses: Apple-Actions/import-codesign-certs@v7
        if: github.ref_type == 'tag' && env.HAS_DEVELOPER_ID == 'true'
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_P12 }}
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      - name: Use the Developer ID certificate and the notary key
        if: github.ref_type == 'tag' && env.HAS_DEVELOPER_ID == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "LAIR_SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
          echo "LAIR_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Make the disk image
        env:
          LAIR_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          LAIR_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export LAIR_VERSION="${GITHUB_REF_NAME#v}"; fi
          LAIR_SIGN_IDENTITY="${LAIR_SIGN_IDENTITY:--}" scripts/make-dmg.sh "$RUNNER_TEMP/Lair.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Lair
          path: ${{ runner.temp }}/Lair.dmg
      # The app's update feed: releases/latest/download/appcast.xml, signed with Sparkle's EdDSA key.
      - name: Sign the update feed
        if: github.ref_type == 'tag'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          cp "$RUNNER_TEMP/Lair.dmg" "$RUNNER_TEMP/release/Lair-$GITHUB_REF_NAME.dmg"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" "$RUNNER_TEMP/release"
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/Lair-$GITHUB_REF_NAME.dmg" "$RUNNER_TEMP/release/appcast.xml" \
            --title "Lair $GITHUB_REF_NAME" --generate-notes --latest
